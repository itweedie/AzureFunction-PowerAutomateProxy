name: Build and Deploy Azure Function App

on:
  push:
    #branches:
    #  - 20250108-deploymentMethodChange
    tags:
      - 'v*' # Trigger on versioned tags (e.g., v1.0.0)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js environment (if applicable)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14.x' # Adjust the Node.js version as needed

      # Step 3: Install dependencies and build the project
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      # Step 4: Archive the build output into a ZIP file
      - name: Archive Project into ZIP
        run: |
          zip -r functionapp.zip .

      # Step 5: Create a GitHub Release and Upload the ZIP
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          body: "Function App package for deployment."
          draft: false
          prerelease: false
          files: functionapp.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
